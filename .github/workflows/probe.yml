name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: probe
    steps:
      - name: Runner IP
        run: curl -s https://api.ipify.org; echo
      - name: Raw SSH handshake (verbose, no key)
        run: |
          timeout 25 ssh -vv -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 deploy@45.9.188.195 true 2>&1 | tail -25 || true

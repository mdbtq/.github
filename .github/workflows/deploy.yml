# Reusable deploy workflow for mdbtq apps.
#
# Publish this file to the mdbtq/.github repository as
# `.github/workflows/deploy.yml`; app repositories then call it with:
#
#   name: Deploy
#   on:
#     push:
#       branches: [main]
#   jobs:
#     deploy:
#       uses: mdbtq/.github/.github/workflows/deploy.yml@main
#       secrets: inherit
#
# It builds the image, pushes it to GHCR and asks the host to switch to the new
# tag. The host already has the compose file and .env from provisioning, so
# nothing but the tag travels — and deploy.sh rolls back on its own when the new
# image fails its healthcheck.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment holding the DEPLOY_* secrets.
        type: string
        default: production
      app_dir:
        description: Application directory on the host.
        type: string
        default: ""
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      build_args:
        description: Newline-separated build arguments.
        type: string
        default: ""
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true

# One deploy at a time per environment: two concurrent runs would race on the
# same .env and could leave the host on the older of the two tags.
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    # Actions are pinned to commit SHAs: a tag can be moved to point at new
    # code, and these steps handle the deploy key.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image and target
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_DIR=${{ inputs.app_dir || format('/opt/apps/{0}', github.event.repository.name) }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            ./deploy.sh "${{ github.sha }}"

# Reusable deploy workflow for mdbtq apps.
#
# Publish this file to the mdbtq/.github repository as
# `.github/workflows/deploy.yml`; app repositories then call it with:
#
#   name: Deploy
#   on:
#     push:
#       branches: [main]
#   jobs:
#     deploy:
#       uses: mdbtq/.github/.github/workflows/deploy.yml@main
#       secrets: inherit
#
# It builds the image, pushes it to GHCR and asks the host to switch to the new
# tag. The host already has the compose file and .env from provisioning, so
# nothing but the tag travels — and deploy.sh rolls back on its own when the new
# image fails its healthcheck.
#
# An app whose host pulls its own deploys passes `deploy_over_ssh: false` and
# gets the build and push only; a timer on the host does the rollout within a
# minute. A green run then means the image was pushed, not that it is serving —
# `make check` in mdbtq/ops is what reports the rollout.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment holding the DEPLOY_* secrets.
        type: string
        default: production
      app_dir:
        description: Application directory on the host.
        type: string
        default: ""
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      build_args:
        description: Newline-separated build arguments.
        type: string
        default: ""
      deploy_over_ssh:
        description: >-
          Whether this workflow rolls the new image out over SSH. Set false for
          an app whose host pulls its own deploys — see docs/proposed-pull-deploy.md
          in mdbtq/ops. The build and push are unchanged either way; only the
          rollout step is skipped, and the DEPLOY_* secrets stop being read.
        type: boolean
        default: true
    secrets:
      # Not required: an app that deploys by pull has no use for them, and
      # declaring them required would force every such repository to keep a
      # deploy key it never uses.
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_SSH_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment: two concurrent runs would race on
    # the same .env and could leave the host on the older of the two tags.
    #
    # Declared on the job, not the workflow: `inputs` is not available in a
    # workflow-level concurrency expression, which fails the run at startup
    # before any step executes.
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    # Actions are pinned to commit SHAs: a tag can be moved to point at new
    # code, and these steps handle the deploy key.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image and target
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_DIR=${{ inputs.app_dir || format('/opt/apps/{0}', github.event.repository.name) }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Stamps the commit into the image itself. A host that sees only a
          # digest — as a poller watching `latest` does — can read the SHA back
          # out of the image config and deploy that tag, without asking the
          # registry API which tags share a digest or trusting a second tag to
          # stay in step. See docs/proposed-pull-deploy.md.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Connecting occasionally times out between GitHub's runners and the
      # host, with the packets never reaching sshd — so the first attempt is
      # allowed to fail. Failing the whole deploy over one dropped connection
      # would leave an image built and pushed but never rolled out.
      #
      # deploy.sh is idempotent, so a retry after a partial run is safe.
      - name: Deploy
        id: deploy
        if: inputs.deploy_over_ssh
        continue-on-error: true
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          # A private repo's image is private too, so the host has to
          # authenticate to pull it. GITHUB_TOKEN is scoped to this run and
          # expires with it, which beats storing a long-lived token on the
          # server — but it means logging in here rather than relying on
          # credentials that happen to be lying around on the host.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          envs: REGISTRY_TOKEN
          script: |
            set -euo pipefail
            echo "$REGISTRY_TOKEN" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd "${{ env.APP_DIR }}"
            ./deploy.sh "${{ github.sha }}"

      # Without this a pull-deploy run just ends after the push, and the log
      # gives no hint that the rollout is someone else's job.
      - name: Note that the host pulls this deploy
        if: ${{ !inputs.deploy_over_ssh }}
        run: |
          echo "Pushed ${{ env.IMAGE }}:${{ github.sha }}."
          echo "This app deploys by pull: a timer on the host rolls it out within a minute."
          echo "It is not serving yet when this run goes green."

      - name: Deploy (retry)
        if: inputs.deploy_over_ssh && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          envs: REGISTRY_TOKEN
          script: |
            set -euo pipefail
            echo "$REGISTRY_TOKEN" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd "${{ env.APP_DIR }}"
            ./deploy.sh "${{ github.sha }}"

name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - name: Attempt ${{ matrix.attempt }}
        run: |
          IP=$(curl -s https://api.ipify.org)
          for t in 45.9.188.195 46.202.153.57; do
            if timeout 12 bash -c "cat </dev/null >/dev/tcp/$t/22" 2>/dev/null; then
              echo "RESULT from=$IP to=$t OPEN"
            else
              echo "RESULT from=$IP to=$t TIMEOUT"
            fi
          done
